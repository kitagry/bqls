version: 2

project_name: bqls

git:
  # vscode-v* tags belong to the VS Code extension, which is released
  # separately. Without this, goreleaser can pick one as the current or
  # previous tag, breaking the snapshot version and the changelog range.
  # Needs goreleaser >= v2.15.4.
  ignore_tags:
    - "vscode-v*"

builds:
  - id: bqls
    main: .
    binary: bqls
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Tag}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        # Anything that dirties the work tree during the release (e.g. an
        # unignored output dir) makes Go stamp vcs.modified=true, which shows
        # up as "(modified)" in --version. Fail before publishing instead.
        # Snapshots are skipped because they are often built from local edits.
        - cmd: >-
            sh -c '{{ if not .IsSnapshot }}if go version -m "{{ .Path }}" | grep -q "vcs.modified=true"; then echo "{{ .Path }} was built from a modified work tree" >&2; exit 1; fi{{ end }}'
          output: true

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  use: github
